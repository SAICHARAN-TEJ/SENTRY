# Supabase itself is NOT composed here: run it via the Supabase CLI locally
# (supabase start) or point .env at a managed project.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  cpu-worker:
    build: .
    command: python -m worker.main
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  gpu-worker:
    build: .
    command: python -m worker.main
    env_file: .env
    environment:
      OPENSR_DEVICE: cuda
    volumes:
      - ./data:/app/data
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
